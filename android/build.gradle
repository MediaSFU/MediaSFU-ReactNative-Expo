// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

subprojects { subproject ->
  subproject.afterEvaluate {
    def androidExtension = subproject.extensions.findByName("android")
    if (androidExtension != null && ["app", "react-native-reanimated"].contains(subproject.name)) {
      def isWindows = System.getProperty("os.name").toLowerCase().contains("windows")
      def shortCxxDir = isWindows
        ? new File("C:/tmp/mediasfu-expo-cxx/${subproject.name}")
        : new File(rootProject.buildDir, "cxx/${subproject.name}")
      androidExtension.externalNativeBuild.cmake {
        buildStagingDirectory shortCxxDir
      }
    }
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
