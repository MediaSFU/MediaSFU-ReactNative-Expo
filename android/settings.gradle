import groovy.json.JsonOutput
import groovy.json.JsonSlurper

pluginManagement {
  def reactNativeGradlePlugin = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
    }.standardOutput.asText.get().trim()
  ).getParentFile().absolutePath
  includeBuild(reactNativeGradlePlugin)
  
  def expoPluginsPath = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })")
    }.standardOutput.asText.get().trim(),
    "../android/expo-gradle-plugin"
  ).absolutePath
  includeBuild(expoPluginsPath)
}

plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}

def releaseAutolinkingExclude = [
  'expo-dev-client',
  'expo-dev-launcher',
  'expo-dev-menu',
  'expo-dev-menu-interface'
]

def isReleaseTask = gradle.startParameter.taskNames.any { taskName ->
  taskName.toLowerCase().contains('release')
}

if (isReleaseTask) {
  def appPackageJsonFile = new File(rootDir.parentFile, 'package.json')
  def releaseAutolinkingRoot = new File(rootDir, '.expo-release-autolinking')
  def releaseAutolinkingPackageJson = new File(releaseAutolinkingRoot, 'package.json')
  def projectPackageJson = new JsonSlurper().parse(appPackageJsonFile)
  def expoConfig = projectPackageJson.expo instanceof Map ? projectPackageJson.expo : [:]
  def autolinkingConfig = expoConfig.autolinking instanceof Map ? expoConfig.autolinking : [:]
  def androidAutolinkingConfig = autolinkingConfig.android instanceof Map ? autolinkingConfig.android : [:]

  androidAutolinkingConfig.exclude = releaseAutolinkingExclude
  autolinkingConfig.android = androidAutolinkingConfig
  expoConfig.autolinking = autolinkingConfig
  projectPackageJson.expo = expoConfig

  releaseAutolinkingRoot.mkdirs()
  releaseAutolinkingPackageJson.text = JsonOutput.prettyPrint(JsonOutput.toJson(projectPackageJson))
  expoAutolinking.projectRoot = releaseAutolinkingRoot
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
  }
}

expoAutolinking.useExpoModules()

rootProject.name = 'MediaSFU'

expoAutolinking.useExpoVersionCatalog()

include ':app'
includeBuild(expoAutolinking.reactNativeGradlePlugin)
